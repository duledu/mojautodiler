<!doctype html><html lang="mk"><head><meta charset="utf-8"><style>
@import url('../fonts/fonts.css');
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden}
body{font-family:'Inter',sans-serif;color:#0F0F14;position:relative;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.a{position:absolute}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.cvl{display:block;flex:none}
.mad{display:inline-flex;align-items:center;white-space:nowrap;line-height:1}
.mad .wm{display:flex;align-items:center;line-height:1}
.mad .wm b{font-weight:800;letter-spacing:-.02em;line-height:1}
.mad.light{color:#fff}.mad.dark{color:#0F0F14}
.lock{display:inline-flex;align-items:center;gap:18px}
.lock .sep{font-weight:300;font-size:20px;opacity:.45;line-height:1}
.lock.light .sep{color:#fff}.lock.dark .sep{color:#0F0F14}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:18px;font-weight:800;border-radius:999px;padding:0 46px;height:94px;font-size:30px;letter-spacing:.02em;white-space:nowrap}
.cta .arr{font-size:34px;font-weight:600}
.cta.y{background:#FFEB28;color:#0F0F14}
.cta.b{background:#0073F0;color:#fff}
.cta.n{background:#0B1630;color:#fff}
.cta.w{background:#fff;color:#0073F0}
.cta.k{background:#0F0F14;color:#fff}
.code{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:3px dashed currentColor;border-radius:20px;padding:12px 32px 14px;line-height:1.05}
.code small{font-size:18px;font-weight:700;letter-spacing:.22em;opacity:.85;margin-bottom:6px}
.code b{font-size:46px;font-weight:900;letter-spacing:.05em}
.disc{font-size:20px;font-weight:500;letter-spacing:.01em}
.pct{font-weight:900;letter-spacing:-.04em;line-height:.9}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.center{left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
html,body{width:1080px;height:1350px}
body{background:#fff}
.ph{position:absolute;left:0;top:560px;width:1080px;height:790px;background:url(../backgrounds/ig09.png) center/cover}
.ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 18%,rgba(5,10,25,0) 50%,rgba(5,10,25,.9) 100%)}
h1{font-size:82px;font-weight:900;letter-spacing:-.035em;line-height:1.02;color:#0B1630}
h1 span{color:#0073F0}
.chip{display:inline-flex;align-items:center;gap:14px;background:#FFEB28;border-radius:999px;padding:12px 26px;font-size:32px;font-weight:900}
.bot{left:64px;right:64px;bottom:76px;display:flex;align-items:center;justify-content:space-between}
.bot .code{color:#fff}
</style></head><body>
<div class="ph"></div>
<div class="a" style="left:72px;top:64px;right:72px;display:flex;justify-content:space-between;align-items:center">
  <img class="cvl" src="../brand/carVertical Primary.svg" style="height:42px;width:302.4px;" alt="carVertical">
  <div class="mad dark" style="gap:7px;opacity:0.95;">
    <img src="../brand/mojautodiler-logo.png" style="height:24px;width:24px;border-radius:50%;flex:none;" alt="MojAutoDiler">
    <div class="wm">
      <b style="font-size:13px;">MojAutoDiler<em style="font-weight:600;color:#C59B4C;">.com</em></b>
    </div>
  </div>
</div>
<div class="a" style="left:72px;top:170px">
  <h1>Провери достапни<br>податоци за <span>оштетувања.</span></h1>
  <div class="chip" style="margin-top:28px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0F0F14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg> 20% ПОПУСТ</div>
</div>
<div class="a bot">
  <div class="code " style="padding:8px 24px 10px"><small>ПРОМО КОД</small><b>MOJAVTODILER</b></div>
  <div class="cta y" style="height:86px;font-size:27px;padding:0 34px">ПРОВЕРИ ИСТОРИЈА<span class="arr">→</span></div>
</div>
<div class="disc" style="color:rgba(255,255,255,.72);position:absolute;left:0;right:0;bottom:30px;text-align:center">Достапноста на податоците зависи од возилото и изворот.</div>
</body></html>
