<!doctype html><html><head><meta charset="utf-8">
  <style>
    @import url('../fonts/fonts.css');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;color:#0F0F14;position:relative;width:1080px;height:1350px;overflow:hidden;background:#0073F0}
    .a{position:absolute}
    .top{position:absolute;inset:0;background:linear-gradient(160deg,#0B1630 0%,#121f3f 100%);clip-path:polygon(0 0,100% 0,100% 50%,0 60%)}
    .goldline{position:absolute;inset:0;background:#C59B4C;clip-path:polygon(0 60%,100% 50%,100% 50.6%,0 60.6%)}
    .center{left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
    .cvl{display:block;flex:none}
    .mad{display:inline-flex;align-items:center;white-space:nowrap;line-height:1}
    .mad .wm{display:flex;align-items:center;line-height:1}
    .mad .wm b{font-weight:800;letter-spacing:-.02em;line-height:1}
    .mad.light{color:#fff}.mad.dark{color:#0F0F14}
    .cta{display:inline-flex;align-items:center;justify-content:center;gap:18px;font-weight:800;border-radius:999px;padding:0 46px;height:90px;font-size:28px;background:#FFEB28;color:#0F0F14}
    .code{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:3px dashed #fff;border-radius:20px;padding:12px 32px 14px;color:#fff}
    .code small{font-size:18px;font-weight:700;letter-spacing:.22em;opacity:.85;margin-bottom:6px}
    .code b{font-size:46px;font-weight:900;letter-spacing:.05em}
    .o{font-size:56px;font-weight:900;color:#fff;letter-spacing:-.02em}
    .o span{background:#FFEB28;color:#0F0F14;padding:2px 16px;border-radius:12px}
    .disc{font-size:20px;font-weight:500;letter-spacing:.01em}

    .mockup-wrap{
      position:absolute;
      left:100px;
      right:100px;
      top:260px;
      height:460px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .mockup-card{
      width:820px;
      height:440px;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,0.65), 0 0 0 1.5px rgba(255,255,255,0.18);
      position:relative;
    }
    .mockup-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }
    .mockup-tag{
      position:absolute;
      bottom:16px;
      right:20px;
      background:rgba(11,22,48,0.85);
      backdrop-filter:blur(10px);
      color:rgba(255,255,255,0.9);
      font-size:17px;
      font-weight:600;
      padding:6px 16px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.2);
    }
  </style>
  </head>
  <body>
    <div class="top"></div><div class="goldline"></div>
    <div class="a center" style="top:60px">
      <div style="font-size:22px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.75);margin-bottom:14px;">PROVERA ISTORIJE VOZILA</div>
      <img class="cvl" src="../brand/carVertical White.svg" style="height:56px;width:403.2px;" alt="carVertical">
      <div style="margin-top:18px;display:inline-flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 20px;">
        <div class="mad light" style="gap:7px;opacity:0.95;">
    <img src="../brand/mojautodiler-logo.png" style="height:24px;width:24px;border-radius:50%;flex:none;" alt="MojAutoDiler">
    <div class="wm">
      <b style="font-size:13px;">MojAutoDiler<em style="font-weight:600;color:#C59B4C;">.com</em></b>
    </div>
  </div>
      </div>
    </div>

    <div class="mockup-wrap">
      <div class="mockup-card">
        <img src="../brand/cv-mockup-2.png" />
        <div class="mockup-tag">carVertical digitalni izveštaj</div>
      </div>
    </div>

    <div class="a center" style="top:765px">
      <div style="color:#fff;font-size:32px;font-weight:600;margin-bottom:18px;">Zajedno za sigurniju kupovinu automobila</div>
      <div class="o"><span>20% POPUSTA</span> na izveštaje</div>
    </div>
    <div class="a center" style="top:940px"><div class="code " style=""><small>PROMO KOD</small><b>MOJAUTODILER</b></div></div>
    <div class="a center" style="top:1100px"><div class="cta y" style="height:88px;font-size:28px">PROVERI ISTORIJU VOZILA<span class="arr">→</span></div></div>
    <div class="disc" style="color:rgba(255,255,255,.78);position:absolute;left:0;right:0;bottom:36px;text-align:center">Dostupnost podataka zavisi od vozila i izvora.</div>
  </body></html>
